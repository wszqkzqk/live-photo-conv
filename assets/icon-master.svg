<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- cyan top blade -->
    <linearGradient id="gCyan" gradientUnits="userSpaceOnUse" x1="128" y1="73.0" x2="128" y2="20.8">
      <stop offset="0" stop-color="#00a9de"/>
      <stop offset="1" stop-color="#00e6fd"/>
    </linearGradient>
    <!-- orange blade -->
    <linearGradient id="gOrange" gradientUnits="userSpaceOnUse" x1="123" y1="40.5" x2="185" y2="60.5">
      <stop offset="0" stop-color="#eeb937"/>
      <stop offset="1" stop-color="#f66b2e"/>
    </linearGradient>
    <!-- red blade -->
    <linearGradient id="gRed" gradientUnits="userSpaceOnUse" x1="190" y1="65.5" x2="216" y2="124.5">
      <stop offset="0" stop-color="#f2463e"/>
      <stop offset="1" stop-color="#e42665"/>
    </linearGradient>
    <!-- magenta blade -->
    <linearGradient id="gMagenta" gradientUnits="userSpaceOnUse" x1="216" y1="127.5" x2="199" y2="179.5">
      <stop offset="0" stop-color="#e42867"/>
      <stop offset="1" stop-color="#dd34c0"/>
    </linearGradient>
    <!-- blue bottom blade -->
    <linearGradient id="gBlue" gradientUnits="userSpaceOnUse" x1="198" y1="187.5" x2="61" y2="187.5">
      <stop offset="0" stop-color="#da32be"/>
      <stop offset="0.1" stop-color="#8635ab"/>
      <stop offset="0.3" stop-color="#493faa"/>
      <stop offset="0.5" stop-color="#234fb3"/>
      <stop offset="0.7" stop-color="#1a64c6"/>
      <stop offset="0.8" stop-color="#1575d4"/>
      <stop offset="1" stop-color="#1b55af"/>
    </linearGradient>
    <!-- orange streaks -->
    <linearGradient id="gSwoosh" gradientUnits="userSpaceOnUse" x1="198" y1="52.5" x2="235" y2="94.5">
      <stop offset="0" stop-color="#f75f32"/>
      <stop offset="1" stop-color="#fd9626"/>
    </linearGradient>
    <!-- detached sliver -->
    <linearGradient id="gSliver" gradientUnits="userSpaceOnUse" x1="211" y1="30.5" x2="241" y2="66.5">
      <stop offset="0" stop-color="#f8812e"/>
      <stop offset="1" stop-color="#fc942b"/>
    </linearGradient>
    <!-- photo sky -->
    <linearGradient id="gSky" gradientUnits="userSpaceOnUse" x1="49" y1="77" x2="49" y2="164">
      <stop offset="0" stop-color="#00cffd"/>
      <stop offset="1" stop-color="#0096f5"/>
    </linearGradient>
    <!-- photo ground band -->
    <linearGradient id="gBand" gradientUnits="userSpaceOnUse" x1="0" y1="164" x2="88" y2="181">
      <stop offset="0" stop-color="#02acbe"/>
      <stop offset="1" stop-color="#0296a0"/>
    </linearGradient>
    <!-- mountains -->
    <linearGradient id="gMtn" gradientUnits="userSpaceOnUse" x1="28" y1="122" x2="84" y2="168">
      <stop offset="0" stop-color="#00877d"/>
      <stop offset="1" stop-color="#38a084"/>
    </linearGradient>
  </defs>

  <!-- ===== aperture blades (true-circle ring, center 128,128) ===== -->
  <!-- each blade is a simple curvilinear triangle: outer circle arc plus two -->
  <!-- straight edges meeting at one apex; uniform 4px white gaps everywhere: -->
  <!-- between blades and between blades and the photo motif -->
  <!-- cyan top (bottom edge exactly horizontal at y=73.0) -->
  <path fill="url(#gCyan)" d="M32.7,73.0 A110.0,110.0 0 0 1 103.4,20.8 L158.3,73.0 Z"/>
  <!-- orange -->
  <path fill="url(#gOrange)" d="M108.2,19.8 A110.0,110.0 0 0 1 189.0,36.5 L189.0,96.6 Z"/>
  <!-- red -->
  <path fill="url(#gRed)" d="M193.0,39.3 A110.0,110.0 0 0 1 237.1,113.8 L193.0,151.4 Z"/>
  <!-- magenta (leading edge exactly horizontal at y=181.0) -->
  <path fill="url(#gMagenta)" d="M237.6,118.6 A110.0,110.0 0 0 1 224.4,181.0 L164.4,181.0 Z"/>
  <!-- blue bottom (circular segment: arc + single chord at y=185.0) -->
  <path fill="url(#gBlue)" d="M33.9,185.0 A110.0,110.0 0 0 0 222.1,185.0 Z"/>

  <!-- RSS/"sharing" streaks: concentric rounded-cap arcs beside the red blade's -->
  <!-- outer edge, inner shorter / outer longer, inside its angular sector -->
  <path fill="url(#gSwoosh)" d="M205.1,36.1 A120.0,120.0 0 0 1 230.9,66.2 A3.5,3.5 0 0 1 224.9,69.8 A113.0,113.0 0 0 0 200.6,41.4 A3.5,3.5 0 0 1 205.1,36.1 Z"/>
  <path fill="url(#gSwoosh)" d="M210.1,26.6 A130.5,130.5 0 0 1 243.2,66.7 A3.5,3.5 0 0 1 237.0,70.0 A123.5,123.5 0 0 0 205.7,32.0 A3.5,3.5 0 0 1 210.1,26.6 Z"/>
  <path fill="url(#gSliver)" d="M215.2,17.2 A141.0,141.0 0 0 1 253.6,64.0 A3.5,3.5 0 0 1 247.4,67.2 A134.0,134.0 0 0 0 210.9,22.7 A3.5,3.5 0 0 1 215.2,17.2 Z"/>

  <!-- ===== photo icon (canvas coords; right edge = arc concentric with ring, r=55) ===== -->
  <!-- sky: bottom edge forms the small blue peak, then tucks under the green -->
  <!-- mountain; bottom-left corner is left open (light/rounded) -->
  <path fill="url(#gSky)" d="M13,77 L107.4,77 A55,55 0 0 0 113.3,181 L46,146 L28,134 L6,155 L6,84 A7,7 0 0 1 13,77 Z"/>
  <!-- green mountain (single, in front of the sky peak); right slope is tangent -->
  <!-- to the r=55 cutout circle, then follows the arc: nothing crosses it -->
  <path fill="url(#gMtn)" d="M18,166 L54,122 L84.4,161.5 A55,55 0 0 0 113.3,181 L18,181 Z"/>
  <!-- ground band: thin strip along the bottom with a rounded left cap, -->
  <!-- right edge follows the same r=55 arc -->
  <path fill="url(#gBand)" d="M14,166 L88.2,166 A55,55 0 0 0 113.3,181 L14,181 A7.5,7.5 0 0 1 14,166 Z"/>
  <!-- sun -->
  <path fill="#ffffff" d="M26.5,93.5 A12,12 0 1 1 26.5,117.5 A12,12 0 1 1 26.5,93.5 Z"/>

  <!-- play triangle (centroid at ring center 128,128): white body, thin gray outline -->
  <path fill="#ffffff" stroke="#5a5a5a" stroke-width="3" d="M112.15,97.58 L164.45,125.42 Q169.3,128 164.45,130.58 L112.15,158.42 Q107.3,161 107.3,155.5 L107.3,100.5 Q107.3,95 112.15,97.58 Z"/>
</svg>
