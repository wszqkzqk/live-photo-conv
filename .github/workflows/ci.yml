name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-archlinux:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Install Base Dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git base-devel sudo

    - name: Create Builder User
      run: |
        useradd -m builder
        echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
        chmod 0440 /etc/sudoers.d/builder

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Fix Directory Permissions
      run: |
        chown -R builder:builder .
        git config --global --add safe.directory "$PWD"

    - name: Build Package
      run: |
        su builder -c "cd $PWD/distros/archlinux && makepkg --noconfirm -s"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: archlinux-package
        path: distros/archlinux/*.pkg.tar.zst

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Flatpak
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder

    - name: Setup Flathub
      run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

    - name: Install Platform & SDK
      run: |
        flatpak install --user --noninteractive flathub \
          org.gnome.Sdk//50 \
          org.gnome.Platform//50

    - name: Build Flatpak
      run: |
        flatpak-builder --user --install --force-clean --disable-rofiles-fuse \
          build-flatpak com.github.wszqkzqk.live-photo-conv.yml

    - name: Export Flatpak Bundle
      run: |
        flatpak build-bundle \
          ~/.local/share/flatpak/repo \
          "live-photo-conv-$(git describe --tags --abbrev=12 | sed 's/^v//;s/-/./g')-$(uname -m).flatpak" \
          com.github.wszqkzqk.live-photo-conv

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: flatpak-bundle
        path: live-photo-conv*.flatpak

  build-windows:
    name: Build Windows (MSYS2 UCRT64) Package
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          base-devel
          git

    - name: Build Package
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE/distros/msys2"
        makepkg-mingw --noconfirm -s

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: windows-package
        path: distros/msys2/*.pkg.tar.zst

  build-android:
    name: Build Android APK (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false

    env:
      ANDROID_SDKVER: "35.0.0"
      ANDROID_NDKVER: "27.2.12479018"
      ANDROID_API: 35
      ABI: arm64-v8a
      MESON_ARCH: aarch64
      GST_VERSION: "1.28.2"

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up environment paths
      run: |
        echo "ANDROID_HOME=${HOME}/android-sdk" >> "${GITHUB_ENV}"
        echo "DEPS_PREFIX=${HOME}/android-deps" >> "${GITHUB_ENV}"
        echo "PATH=${HOME}/android-sdk/ndk/${ANDROID_NDKVER}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}" >> "${GITHUB_ENV}"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache cmake curl gettext git git-lfs \
          glslc gobject-introspection gir1.2-glib-2.0-dev libglib2.0-dev-bin valac \
          libglib-perl libglib-object-introspection-perl \
          libipc-run-perl libjson-perl libset-scalar-perl \
          libxml-libxml-perl libxml-libxslt-perl \
          libxml2-utils ninja-build openjdk-17-jdk \
          perl pkg-config python3 python3-pip sassc unzip wget xz-utils \
          gir1.2-appstream-1.0 libcurl4-openssl-dev
        pip3 install --break-system-packages meson

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: android-${{ env.MESON_ARCH }}
        max-size: 2G

    # ── Android SDK / NDK ──

    - name: Restore Android SDK cache
      id: cache-sdk
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.ANDROID_HOME }}
        key: android-sdk-${{ env.ANDROID_SDKVER }}-${{ env.ANDROID_NDKVER }}-v2

    - name: Install Android SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        mkdir -p "${ANDROID_HOME}"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-*.zip
        mkdir -p "${ANDROID_HOME}/cmdline-tools/latest"
        mv cmdline-tools/* "${ANDROID_HOME}/cmdline-tools/latest/"
        rm -rf cmdline-tools commandlinetools-linux-*.zip

        # Accept SDK licenses (sha1 hash method, reliable for CI)
        mkdir -p "${ANDROID_HOME}/licenses"
        for entry in \
          "android-sdk-license=8933bad161af4178b1185d1a37fbf41ea5269c55" \
          "android-sdk-license=d56f5187479451eabf01fb78af6dfcb131a6481e" \
          "android-sdk-license=24333f8a63b6825ea9c5514f83c2829b004d1fee" \
          "android-sdk-preview-license=84831b9409646a918e30573bab4c9c91346d8abd" \
          "android-sdk-preview-license-old=79120722343a6f314e0719f863036c702b0e6b2a"; do
          name="${entry%%=*}"
          hash="${entry#*=}"
          echo "$hash" >> "${ANDROID_HOME}/licenses/${name}"
        done

        # Suppress SDK repository prompt
        mkdir -p ~/.android
        echo 'count=0' > ~/.android/repositories.cfg

        # Install SDK components
        "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" \
          "build-tools;${ANDROID_SDKVER}" \
          "ndk;${ANDROID_NDKVER}" \
          "platforms;android-${ANDROID_API}"

    - name: Save Android SDK cache
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.ANDROID_HOME }}
        key: ${{ steps.cache-sdk.outputs.cache-primary-key }}

    # ── GStreamer & Exiv2/GExiv2 deps ──

    - name: Restore pre-built deps cache
      id: cache-deps
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.DEPS_PREFIX }}
        key: android-deps-${{ env.GST_VERSION }}-exiv2-v6

    - name: Download and extract pre-built GStreamer
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        GST_TARBALL="gstreamer-1.0-android-universal-${GST_VERSION}.tar.xz"
        GST_URL="https://gstreamer.freedesktop.org/pkg/android/${GST_VERSION}/${GST_TARBALL}"
        TMPDIR="${RUNNER_TEMP}/gst-extract"
        mkdir -p "${DEPS_PREFIX}" "${TMPDIR}"

        echo "Downloading GStreamer ${GST_VERSION}..."
        wget -nv "${GST_URL}" -O "${RUNNER_TEMP}/${GST_TARBALL}"

        echo "Extracting to ${TMPDIR}..."
        tar -xf "${RUNNER_TEMP}/${GST_TARBALL}" -C "${TMPDIR}"

        # The tarball has a flat structure: arm64/ armv7/ x86/ x86_64/ share/
        cp -a "${TMPDIR}/arm64/"* "${DEPS_PREFIX}/"
        if [ -d "${TMPDIR}/share" ]; then
          mkdir -p "${DEPS_PREFIX}/share"
          cp -a "${TMPDIR}/share/"* "${DEPS_PREFIX}/share/"
        fi

        # Remove pkg-config files shipped by GStreamer that conflict with our
        # own builds (expat, zlib) or with pixiewood's (glib, gobject, gio).
        # Static libs (.a) carry unresolved pcre2 references; delete them.
        rm -f "${DEPS_PREFIX}/lib/pkgconfig"/{expat,pcre2-8,glib-2.0,gobject-2.0,gio-2.0,gmodule-2.0}.pc 2>/dev/null || true
        rm -f "${DEPS_PREFIX}/share/pkgconfig"/{glib-2.0,gobject-2.0,gio-2.0,gmodule-2.0}.pc 2>/dev/null || true
        find "${DEPS_PREFIX}" -name '*.a' -delete

        rm -rf "${RUNNER_TEMP}/${GST_TARBALL}" "${TMPDIR}"
        echo "${GST_VERSION}" > "${DEPS_PREFIX}/.gstreamer-version"
        echo "GStreamer ${GST_VERSION} installed to ${DEPS_PREFIX}"

    - name: Build GExiv2 VAPI natively
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        bash android/build-exiv2-android.sh \
          "${ANDROID_HOME}/ndk/${ANDROID_NDKVER}" \
          "${ANDROID_API}" \
          "${ABI}" \
          "${DEPS_PREFIX}"

    - name: Save pre-built deps cache
      if: steps.cache-deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.DEPS_PREFIX }}
        key: ${{ steps.cache-deps.outputs.cache-primary-key }}

    # ── pixiewood build ──

    - name: Install pkg-config wrapper alongside NDK compiler
      run: |
        NDK_BIN="${ANDROID_HOME}/ndk/${ANDROID_NDKVER}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        for api in 31 33 34 35; do
          NAME="aarch64-linux-android${api}-pkg-config"
          cat > /tmp/pkgwrap <<'WRAPPER'
        #!/bin/sh
        export PKG_CONFIG_PATH="${DEPS_PREFIX}/lib/pkgconfig:${DEPS_PREFIX}/share/pkgconfig"
        exec /usr/bin/pkg-config "$@"
        WRAPPER
          sudo cp /tmp/pkgwrap "${NDK_BIN}/${NAME}"
          sudo chmod +x "${NDK_BIN}/${NAME}"
        done
        ${NDK_BIN}/aarch64-linux-android31-pkg-config --version

    - name: Clone pixiewood and mini-studio
      run: |
        git clone https://github.com/sp1ritCS/gtk-android-builder.git --branch android36 pixiewood
        git clone --depth 1 https://github.com/sp1ritCS/mini-studio.git

    - name: Pre-download subproject tarballs
      run: |
        mkdir -p subprojects/
        wget -nv https://download.gnome.org/sources/gexiv2/0.16/gexiv2-0.16.0.tar.xz -O subprojects/gexiv2-0.16.0.tar.xz || true
        wget -nv https://github.com/Exiv2/exiv2/archive/refs/tags/v0.28.8.tar.gz -O subprojects/exiv2-0.28.8.tar.gz || true
        wget -nv https://github.com/libexpat/libexpat/releases/download/R_2_7_5/expat-2.7.5.tar.xz -O subprojects/expat-2.7.5.tar.xz || true
        wget -nv https://download.gnome.org/sources/libadwaita/1.6/libadwaita-1.6.5.tar.xz -O subprojects/libadwaita-1.6.5.tar.xz || true
        echo "Subproject tarballs staged:"
        ls -la subprojects/

    - name: pixiewood prepare
      run: |
        ./pixiewood/pixiewood prepare --release \
          -s "${ANDROID_HOME}" \
          -a ./mini-studio \
          pixiewood.xml

    - name: pixiewood generate
      run: |
        ./pixiewood/pixiewood generate

    - name: Copy extra native libraries for APK packaging
      run: |
        # pixiewood packages .so files from its meson install prefix
        # (glib, cairo, gtk, etc.). We add external deps here.
        JNILIBS=".pixiewood/android/app/src/main/jniLibs/${ABI}"
        mkdir -p "${JNILIBS}"

        # Copy GStreamer core shared libraries,
        # but skip glib/gobject/gio/gmodule (pixiewood provides these).
        for sofile in "${DEPS_PREFIX}"/lib/*.so; do
          [ -f "$sofile" ] || continue
          name=$(basename "$sofile")
          case "$name" in
            libglib-*|libgobject-*|libgio-*|libgmodule-*)
              ;;
            *)
              cp "$sofile" "${JNILIBS}/"
              ;;
          esac
        done

        # Copy GStreamer plugins into the expected subdirectory
        if [ -d "${DEPS_PREFIX}/lib/gstreamer-1.0" ]; then
          mkdir -p "${JNILIBS}/gstreamer-1.0"
          cp "${DEPS_PREFIX}/lib/gstreamer-1.0/"*.so "${JNILIBS}/gstreamer-1.0/" 2>/dev/null || true
        fi

        echo "Extra native libraries staged:"
        find "${JNILIBS}" -name "*.so" | sort

    - name: Copy GExiv2 VAPI for valac
      run: |
        # GExiv2's Android .so is built as a meson subproject (vapi=false).
        # The VAPI files were pre-generated by android/build-exiv2-android.sh.
        # Copy them to the vapi/ dir referenced by meson.build's --vapidir.
        mkdir -p vapi
        cp "${DEPS_PREFIX}/share/vala/vapi/"* vapi/ 2>/dev/null || true
        echo "VAPI files staged:"
        ls -la vapi/

    - name: pixiewood build
      run: |
        export ANDROID_DEPS_PREFIX="${DEPS_PREFIX}"
        ./pixiewood/pixiewood build

    - name: Collect APK
      run: |
        mkdir -p apks
        cp .pixiewood/android/app/build/outputs/apk/release/*.apk apks/ 2>/dev/null || \
        cp .pixiewood/android/app/build/outputs/apk/debug/*.apk apks/ 2>/dev/null || true
        echo "APKs produced:"
        ls -lh apks/

    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: android-apk-aarch64
        path: apks/*.apk

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [build-archlinux, build-flatpak, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: '*-package'
        merge-multiple: true
        path: dist

    - uses: actions/download-artifact@v8
      with:
        name: flatpak-bundle
        merge-multiple: true
        path: dist

    - uses: actions/download-artifact@v8
      with:
        name: android-apk-aarch64
        path: dist

    - name: Remove Debug Packages
      run: rm -f dist/*-debug-*.pkg.tar.zst

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        files: dist/*
        generate_release_notes: true
