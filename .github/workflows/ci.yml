name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-archlinux:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Install Base Dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git base-devel sudo

    - name: Create Builder User
      run: |
        useradd -m builder
        echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
        chmod 0440 /etc/sudoers.d/builder

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Fix Directory Permissions
      run: |
        chown -R builder:builder .
        git config --global --add safe.directory "$PWD"

    - name: Validate Desktop Integration Files
      run: |
        pacman -S --noconfirm desktop-file-utils appstream
        desktop-file-validate assets/com.github.wszqkzqk.live-photo-conv.desktop
        appstreamcli validate --pedantic assets/com.github.wszqkzqk.live-photo-conv.metainfo.xml

    - name: Build Package
      run: |
        su builder -c "cd $PWD/distros/archlinux && makepkg --noconfirm -s"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: archlinux-package
        path: distros/archlinux/*.pkg.tar.zst

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Flatpak
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder

    - name: Setup Flathub
      run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

    - name: Install Platform & SDK
      run: |
        flatpak install --user --noninteractive flathub \
          org.gnome.Sdk//50 \
          org.gnome.Platform//50

    - name: Build Flatpak
      run: |
        flatpak-builder --user --install --force-clean --disable-rofiles-fuse \
          build-flatpak com.github.wszqkzqk.live-photo-conv.yml

    - name: Export Flatpak Bundle
      run: |
        flatpak build-bundle \
          ~/.local/share/flatpak/repo \
          "live-photo-conv-$(git describe --tags --abbrev=12 | sed 's/^v//;s/-/./g')-$(uname -m).flatpak" \
          com.github.wszqkzqk.live-photo-conv

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: flatpak-bundle
        path: live-photo-conv*.flatpak

  build-windows:
    name: Build Windows (MSYS2 UCRT64) Package
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          base-devel
          git

    - name: Build Package
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE/distros/msys2"
        makepkg-mingw --noconfirm -s

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: windows-package
        path: distros/msys2/*.pkg.tar.zst

  build-macos:
    name: Build macOS Homebrew Package
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Build Package
      run: |
        brew update
        brew tap-new --no-git wszqkzqk/live-photo-conv
        formula="$(brew --repository wszqkzqk/live-photo-conv)/Formula/live-photo-conv.rb"
        cp Formula/live-photo-conv.rb "$formula"
        sed -i '' "s|https://github.com/wszqkzqk/live-photo-conv.git\", branch: \"main\", using: :git|file://$GITHUB_WORKSPACE\", revision: \"$GITHUB_SHA\", using: :git|" "$formula"

        brew install --HEAD wszqkzqk/live-photo-conv/live-photo-conv
        brew test wszqkzqk/live-photo-conv/live-photo-conv

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # GitHub-hosted runners ship the Android SDK with sdkmanager here
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDKVER: "36.1.0"
      ANDROID_NDKVER: "29.0.14206865"
      LPC_KEYSTORE_BASE64: ${{ secrets.LPC_KEYSTORE_BASE64 }}
      LPC_KEYSTORE_PASSWORD: ${{ secrets.LPC_KEYSTORE_PASSWORD }}
      LPC_KEY_ALIAS: ${{ secrets.LPC_KEY_ALIAS }}
      LPC_KEY_PASSWORD: ${{ secrets.LPC_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Releases must not ship debug-signed APKs
    - name: Require signing secrets on tag builds
      if: github.ref_type == 'tag'
      run: |
        if [ -z "$LPC_KEYSTORE_BASE64" ] || [ -z "$LPC_KEYSTORE_PASSWORD" ] || [ -z "$LPC_KEY_ALIAS" ] || [ -z "$LPC_KEY_PASSWORD" ]; then
          echo "Tag builds must be signed with the release keystore, but the signing secrets are not set."
          exit 1
        fi

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bison ccache cmake flex gettext gir1.2-appstream-1.0 glslc gperf \
          libglib-perl libglib-object-introspection-perl libglib2.0-dev-bin \
          libipc-run-perl libjson-perl libset-scalar-perl libxml-libxml-perl \
          libxml-libxslt-perl nasm ninja-build openjdk-17-jdk pkg-config \
          python3-pip sassc unzip valac wget xz-utils
        pip3 install --break-system-packages meson

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: android
        max-size: 2G

    - name: Install Android SDK Components
      run: bash build-aux/android-sdk.sh

    - name: Clone pixiewood and mini-studio
      run: |
        git clone https://github.com/sp1ritCS/gtk-android-builder.git --branch android36 pixiewood-tool
        git clone --depth 1 https://github.com/sp1ritCS/mini-studio.git

    - name: pixiewood prepare
      run: |
        ./pixiewood-tool/pixiewood prepare --release \
          -s "${ANDROID_HOME}" \
          -t "${ANDROID_HOME}/ndk/${ANDROID_NDKVER}" \
          -a ./mini-studio \
          pixiewood.xml

    - name: pixiewood generate
      run: ./pixiewood-tool/pixiewood generate

    - name: pixiewood build
      run: ./pixiewood-tool/pixiewood build

    - name: Prepare signing keystore
      run: |
        # Fall back to a debug key when the release secrets are not set
        if [ -n "$LPC_KEYSTORE_BASE64" ] && [ -n "$LPC_KEYSTORE_PASSWORD" ] && [ -n "$LPC_KEY_ALIAS" ] && [ -n "$LPC_KEY_PASSWORD" ]; then
          echo "$LPC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks"
          echo "KS_PASS=$LPC_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$LPC_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KS_ALIAS_PASS=$LPC_KEY_PASSWORD" >> "$GITHUB_ENV"
        else
          keytool -genkeypair -keystore "$RUNNER_TEMP/ks" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 365 \
            -storepass android -keypass android -dname "CN=Android Debug"
          echo "KS_PASS=android" >> "$GITHUB_ENV"
          echo "KS_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "KS_ALIAS_PASS=android" >> "$GITHUB_ENV"
        fi
        echo "KS=$RUNNER_TEMP/ks" >> "$GITHUB_ENV"

    - name: Sign and rename APKs
      run: |
        set -euo pipefail
        find .pixiewood/android/app/build/outputs -name '*.apk' | sort
        VERSION="$(git describe --tags --abbrev=12 | sed 's/^v//;s/-/./g')"
        for ABI in arm64-v8a x86_64 universal; do
          APK_IN="$(find .pixiewood/android/app/build/outputs/apk -path "*${ABI}*" -name '*.apk' | head -1)"
          "${ANDROID_HOME}/build-tools/${ANDROID_SDKVER}/apksigner" sign \
            --ks "$KS" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KS_ALIAS_PASS" \
            --out "live-photo-conv-${VERSION}-android-${ABI}.apk" \
            "$APK_IN"
        done

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: android-apk
        path: live-photo-conv-*-android-*.apk

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [build-archlinux, build-flatpak, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: '*-package'
        merge-multiple: true
        path: dist

    - uses: actions/download-artifact@v8
      with:
        name: flatpak-bundle
        merge-multiple: true
        path: dist

    - uses: actions/download-artifact@v8
      with:
        name: android-apk
        merge-multiple: true
        path: dist

    - name: Remove Debug Packages
      run: rm -f dist/*-debug-*.pkg.tar.zst

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        files: dist/*
        generate_release_notes: true

  aur-publish:
    name: Publish to AUR
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      AUR_PACKAGE: live-photo-conv
    steps:
    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git openssh

    - name: Create build user
      run: |
        useradd -m builder
        echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Configure SSH for AUR
      run: |
        mkdir -p /root/.ssh
        echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /root/.ssh/aur
        chmod 600 /root/.ssh/aur
        cat > /root/.ssh/config << 'EOF'
        Host aur.archlinux.org
          IdentityFile /root/.ssh/aur
          User aur
          StrictHostKeyChecking accept-new
        EOF
        chmod 600 /root/.ssh/config

    - name: Update PKGBUILD version and checksums
      run: |
        git config --global --add safe.directory '*'
        mkdir -p /tmp/aur-build
        cp distros/archlinux/PKGBUILD-AUR /tmp/aur-build/PKGBUILD
        TAG_VERSION="${{ github.ref_name }}"
        PKGVER="${TAG_VERSION#v}"
        sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" /tmp/aur-build/PKGBUILD
        echo "Updated pkgver to ${PKGVER}"

        GIT_CHECKSUM=$(git -c core.abbrev=no archive --format tar "${TAG_VERSION}" | sha256sum | cut -d' ' -f1)
        echo "Computed git archive checksum: ${GIT_CHECKSUM}"
        sed -i "s/@SHA256SUM@/${GIT_CHECKSUM}/" /tmp/aur-build/PKGBUILD
        echo "Updated sha256sums"

        chown -R builder:builder /tmp/aur-build

    - name: Generate .SRCINFO
      run: |
        su builder -c 'cd /tmp/aur-build && makepkg --printsrcinfo' > /tmp/aur-build/.SRCINFO
        cat /tmp/aur-build/.SRCINFO

    - name: Push to AUR
      run: |
        git config --global user.name "${{ secrets.AUR_USERNAME }}"
        git config --global user.email "${{ secrets.AUR_EMAIL }}"

        git clone ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git /tmp/aur-repo || {
          mkdir -p /tmp/aur-repo
          cd /tmp/aur-repo
          git init
          git remote add origin ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git
        }

        cd /tmp/aur-repo

        cp /tmp/aur-build/PKGBUILD .
        cp /tmp/aur-build/.SRCINFO .

        git add PKGBUILD .SRCINFO
        if git diff --cached --quiet; then
          echo "No changes to push"
        else
          git commit -m "Update to ${{ github.ref_name }}"
          git push origin master
        fi
