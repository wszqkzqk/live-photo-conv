name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-archlinux:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Install Base Dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git base-devel sudo

    - name: Create Builder User
      run: |
        useradd -m builder
        echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
        chmod 0440 /etc/sudoers.d/builder

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Fix Directory Permissions
      run: |
        chown -R builder:builder .
        git config --global --add safe.directory "$PWD"

    - name: Build Package
      run: |
        su builder -c "cd $PWD/distros/archlinux && makepkg --noconfirm -s"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: archlinux-package
        path: distros/archlinux/*.pkg.tar.zst

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Flatpak
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder

    - name: Setup Flathub
      run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

    - name: Install Platform & SDK
      run: |
        flatpak install --user --noninteractive flathub \
          org.gnome.Sdk//50 \
          org.gnome.Platform//50

    - name: Build Flatpak
      run: |
        flatpak-builder --user --install --force-clean --disable-rofiles-fuse \
          build-flatpak com.github.wszqkzqk.live-photo-conv.yml

    - name: Export Flatpak Bundle
      run: |
        flatpak build-bundle \
          ~/.local/share/flatpak/repo \
          "live-photo-conv-$(git describe --tags --abbrev=12 | sed 's/^v//;s/-/./g')-$(uname -m).flatpak" \
          com.github.wszqkzqk.live-photo-conv

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: flatpak-bundle
        path: live-photo-conv*.flatpak

  build-windows:
    name: Build Windows (MSYS2 UCRT64) Package
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          base-devel
          git

    - name: Build Package
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE/distros/msys2"
        makepkg-mingw --noconfirm -s

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: windows-package
        path: distros/msys2/*.pkg.tar.zst

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [build-archlinux, build-flatpak, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: '*-package'
        merge-multiple: true
        path: dist

    - uses: actions/download-artifact@v8
      with:
        name: flatpak-bundle
        merge-multiple: true
        path: dist

    - name: Remove Debug Packages
      run: rm -f dist/*-debug-*.pkg.tar.zst

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        files: dist/*
        generate_release_notes: true
