name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-archlinux:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
    - name: Install Base Dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git base-devel sudo

    - name: Create Builder User
      run: |
        useradd -m builder
        echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
        chmod 0440 /etc/sudoers.d/builder

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fix Directory Permissions
      run: |
        chown -R builder:builder .
        git config --global --add safe.directory "$PWD"

    - name: Build Package
      run: |
        su builder -c "cd $PWD/distros/archlinux && makepkg --noconfirm -s"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: archlinux-package
        path: distros/archlinux/*.pkg.tar.zst

  build-windows:
    name: Build Windows (MSYS2 UCRT64) Package
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          base-devel
          git

    - name: Build Package
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE/distros/msys2"
        makepkg-mingw --noconfirm -s

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-package
        path: distros/msys2/*.pkg.tar.zst

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [build-archlinux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: '*-package'
        merge-multiple: true
        path: dist

    - name: Remove Debug Packages
      run: rm -f dist/*-debug-*.pkg.tar.zst

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        files: dist/*
        generate_release_notes: true
